[package]
name = "stargate-app"
version = "0.1.0"
edition = "2021"

[dependencies]
glow = "0.14"
glutin = "0.32"
glutin-winit = "0.5"
imgui = "0.12"
imgui-glow-renderer = "0.13"
imgui-winit-support = "0.13"
raw-window-handle = "0.6"
winit = "0.30"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
stargate-emu = { path = "../stargate-emu" }
wms-sound = { path = "../wms-sound" }
grl-sources = { path = "../grl-sources", features = ["serde"] }
serde_json = "1.0"
tree-sitter = "0.25.6"

[build-dependencies]
cc = "1"
