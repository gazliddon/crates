[package]
name = "emu68000"
version = "0.1.0"
authors = ["Gaz Liddon"]
categories = ["emulators"]
keywords = ["68000", "motorola", "jaguar", "tempest", "emulator"]
edition = "2021"
build = "build.rs"
description = "In development Motorola 68000 emulator (Tempest 2000 / Atari Jaguar)"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/gazliddon/crates"

[build-dependencies]
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"

[dependencies]
byteorder = "1.4.3"
emucore = { path = "../emucore" }
log = "0.4.20"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "1.0.48"
