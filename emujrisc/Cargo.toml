[package]
name = "emujrisc"
version = "0.1.0"
authors = ["Gaz Liddon"]
categories = ["emulators"]
keywords = ["jaguar", "gpu", "dsp", "jrisc", "tom", "jerry"]
edition = "2021"
build = "build.rs"
description = "Atari Jaguar GPU/DSP (JRISC) emulator, in development"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/gazliddon/crates"

[build-dependencies]
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"

[dependencies]
byteorder = "1.4.3"
emucore = { path = "../emucore" }
log = "0.4.20"
serde = { version = "1.0.188", features = ["derive"] }
serde_json = "1.0.107"
thiserror = "1.0.48"
